services:
  app:
    build: .
    # ホストのユーザー(UID/GID 1000)と node ユーザーが一致するため、生成ファイルの所有者はずれない
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - qiita-cli-config:/home/node/.config/qiita-cli
    ports:
      - "127.0.0.1:8888:8888"
    command: ["bash"]

volumes:
  node_modules:
  qiita-cli-config:
